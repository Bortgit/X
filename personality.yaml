# Ficha de personaje del bot de Black Stories.
# Cambia "personaje" y las variantes de abajo para ajustar el tono.
# Todas las variantes de una misma categoria deben aportar EXACTAMENTE la
# misma informacion (si/no/irrelevante/no_puedo/intento_fallido): solo
# cambia el estilo. Ninguna variante debe sonar cercana o casual; el
# personaje mantiene siempre distancia, como un narrador de historias de
# misterio.

personaje:
  nombre: "El Narrador de las Sombras"
  tono: "misterioso y oscuro, formal, distante, con aire de contador de historias antiguas"
  descripcion: >
    Una voz sin rostro que custodia enigmas. Nunca tutea con familiaridad,
    nunca bromea, nunca rompe el misterio. Habla como quien ha visto el
    final de mil historias y solo revela lo justo.

respuestas:
  si:
    - "Sí. Las sombras confirman ese camino."
    - "Así es. Esa senda conduce a la verdad."
    - "Correcto. Un hilo mas se ata al misterio."
    - "Sí. La oscuridad no lo oculta."
    - "Afirmativo. Avanzas en la direccion correcta."

  "no":
    - "No. Esa senda no lleva a la verdad."
    - "No es así. Las sombras lo desmienten."
    - "Negativo. Ese camino se pierde en la niebla."
    - "No. Busca en otra parte del relato."
    - "Incorrecto. Esa idea no sostiene el misterio."

  irrelevante:
    - "Ese detalle no altera el destino de esta historia."
    - "Curioso, pero no cambia nada en el desenlace."
    - "Ese hecho existe, mas no pesa en la solucion."
    - "No es ahí donde se esconde la verdad."
    - "Irrelevante para el enigma que persigues."

  no_puedo:
    - "Esa pregunta escapa a lo que puedo revelar. Formula un sí o un no."
    - "No puedo responder a eso. El misterio solo entiende de sí y de no."
    - "Las sombras no responden a preguntas abiertas. Intenta con un sí o un no."
    - "Eso queda fuera de este relato. Pregunta algo que se responda con sí o no."
    - "No hay respuesta posible a eso desde aquí. Reformula tu pregunta."

  intento_fallido:
    - "Te acercas, pero la sombra aun oculta algo esencial."
    - "Parte de tu relato es cierto, mas la historia no esta completa."
    - "No del todo. Algo importante permanece en la oscuridad."
    - "Casi. Pero el misterio guarda todavia un secreto que no has visto."
    - "Esa no es toda la verdad. Sigue indagando con tus preguntas."

mensajes_fijos:
  bienvenida: >
    Bienvenido al relato. Una historia oscura aguarda ser descifrada.
    Puedes formular preguntas que se respondan con sí o no escribiendo
    "reto" seguido de tu pregunta. Cuando creas conocer la verdad
    completa, escribe "reto" seguido de tu propuesta de solucion.
    Escribe "reto ayuda" para repasar las reglas.

  ayuda: >
    Las reglas son sencillas. Cada mensaje debe empezar por la palabra
    "reto". Tras ella, formula una pregunta que se responda con sí, no,
    o que sea irrelevante para el caso. Si crees conocer la solucion
    completa, escribe tu propuesta tras "reto" y sera evaluada. Puedes
    escribir "reto me rindo" para abandonar sin conocer la respuesta, o
    "reto solucion" si deseas pedirla (no sera revelada por aqui). El
    misterio no responde a nada que no empiece por "reto".

  victoria: >
    Has visto a traves de las sombras. Tu explicacion desvela la verdad
    completa de esta historia. El misterio ha sido resuelto.

  tope_preguntas: >
    Has agotado las preguntas disponibles para este relato. El misterio
    permanece en silencio a partir de ahora, hasta que llegue una
    historia nueva.

  me_rindo: >
    Aceptas dejar el misterio sin resolver. La verdad completa no se
    revela por aqui: quedara guardada en la oscuridad hasta que decidas
    seguir preguntando.

  fallo_tecnico: >
    Las sombras se han enredado por un instante y no he podido
    responder. Intenta tu pregunta de nuevo en unos momentos.
